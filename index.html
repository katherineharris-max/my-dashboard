<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }
        
        .header-left h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 5px;
        }
        
        .header-left p {
            color: #999;
            font-size: 14px;
        }
        
        .refresh-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: background 0.3s;
        }
        
        .refresh-btn:hover {
            background: #764ba2;
        }
        
        .refresh-btn.loading {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-left: 4px solid #667eea;
        }
        
        .stat-box .label {
            font-size: 12px;
            color: #999;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        
        .stat-box .value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .data-table th {
            background: #f5f5f5;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #667eea;
            font-size: 13px;
        }
        
        .data-table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
            color: #555;
            font-size: 13px;
        }
        
        .data-table tr:hover {
            background: #f9f9f9;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-left">
                <h1>📊 Sales Dashboard</h1>
                <p id="lastUpdate">Sample Data • Updated just now</p>
            </div>
            <button class="refresh-btn" id="refreshBtn" onclick="loadData()">🔄 Refresh</button>
        </div>
        
        <div id="stats" class="stats"></div>
        
        <div class="dashboard">
            <div class="card">
                <h2>📈 Revenue by Product</h2>
                <div class="chart-container">
                    <canvas id="productChart"></canvas>
                </div>
            </div>
            
            <div class="card">
                <h2>🌍 Revenue by Region</h2>
                <div class="chart-container">
                    <canvas id="regionChart"></canvas>
                </div>
            </div>
            
            <div class="card" style="grid-column: 1 / -1;">
                <h2>📋 Recent Transactions</h2>
                <div id="dataTable"></div>
            </div>
        </div>
    </div>

    <script>
        // Sample data embedded directly
        const sampleData = [
            ['Date', 'Product', 'Revenue', 'Region'],
            ['2024-01-01', 'Laptop', '2500', 'North'],
            ['2024-01-02', 'Monitor', '450', 'South'],
            ['2024-01-03', 'Keyboard', '85', 'East'],
            ['2024-01-04', 'Mouse', '35', 'West'],
            ['2024-01-05', 'Laptop', '2500', 'South'],
            ['2024-01-06', 'Monitor', '450', 'North'],
            ['2024-01-07', 'Headphones', '120', 'East'],
            ['2024-01-08', 'Laptop', '2500', 'West'],
            ['2024-01-09', 'Keyboard', '85', 'South'],
            ['2024-01-10', 'Monitor', '450', 'North'],
            ['2024-01-11', 'Mouse', '35', 'East'],
            ['2024-01-12', 'Laptop', '2500', 'South'],
            ['2024-01-13', 'Headphones', '120', 'West'],
            ['2024-01-14', 'Monitor', '450', 'East'],
            ['2024-01-15', 'Keyboard', '85', 'North'],
            ['2024-01-16', 'Laptop', '2500', 'North'],
            ['2024-01-17', 'Mouse', '35', 'South'],
            ['2024-01-18', 'Monitor', '450', 'West'],
            ['2024-01-19', 'Headphones', '120', 'North'],
            ['2024-01-20', 'Keyboard', '85', 'East']
        ];

        let productChart = null;
        let regionChart = null;

        function loadData() {
            const headers = sampleData[0];
            const rows = sampleData.slice(1);
            
            // Display stats
            displayStats(rows);
            
            // Display charts
            displayProductChart(rows);
            displayRegionChart(rows);
            
            // Display table
            displayTable(headers, rows);
            
            // Update timestamp
            document.getElementById('lastUpdate').textContent = 
                `Sample Data • Updated ${new Date().toLocaleTimeString()}`;
        }

        function displayStats(rows) {
            const statsDiv = document.getElementById('stats');
            statsDiv.innerHTML = '';
            
            const totalRevenue = rows.reduce((sum, row) => sum + parseInt(row[2]), 0);
            const totalTransactions = rows.length;
            const avgTransaction = Math.round(totalRevenue / totalTransactions);
            const uniqueProducts = new Set(rows.map(r => r[1])).size;
            
            const stats = [
                { icon: '💰', label: 'Total Revenue', value: `$${totalRevenue.toLocaleString()}` },
                { icon: '📦', label: 'Total Orders', value: totalTransactions },
                { icon: '📊', label: 'Avg Order Value', value: `$${avgTransaction}` },
                { icon: '🎯', label: 'Unique Products', value: uniqueProducts }
            ];
            
            stats.forEach(stat => {
                const box = document.createElement('div');
                box.className = 'stat-box';
                box.innerHTML = `
                    <div class="label">${stat.icon} ${stat.label}</div>
                    <div class="value">${stat.value}</div>
                `;
                statsDiv.appendChild(box);
            });
        }

        function displayProductChart(rows) {
            const productData = {};
            rows.forEach(row => {
                const product = row[1];
                const revenue = parseInt(row[2]);
                productData[product] = (productData[product] || 0) + revenue;
            });
            
            const labels = Object.keys(productData);
            const data = Object.values(productData);
            
            const ctx = document.getElementById('productChart');
            
            if (productChart) productChart.destroy();
            
            productChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Revenue ($)',
                        data: data,
                        backgroundColor: ['#667eea', '#764ba2', '#f093fb', '#4facfe'],
                        borderRadius: 5,
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: { beginAtZero: true }
                    }
                }
            });
        }

        function displayRegionChart(rows) {
            const regionData = {};
            rows.forEach(row => {
                const region = row[3];
                const revenue = parseInt(row[2]);
                regionData[region] = (regionData[region] || 0) + revenue;
            });
            
            const labels = Object.keys(regionData);
            const data = Object.values(regionData);
            
            const ctx = document.getElementById('regionChart');
            
            if (regionChart) regionChart.destroy();
            
            regionChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: data,
                        backgroundColor: ['#667eea', '#764ba2', '#f093fb', '#4facfe'],
                        borderWidth: 2,
                        borderColor: 'white'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }

        function displayTable(headers, rows) {
            const tableDiv = document.getElementById('dataTable');
            
            let html = '<table class="data-table"><thead><tr>';
            headers.forEach(h => html += `<th>${h}</th>`);
            html += '</tr></thead><tbody>';
            
            rows.reverse().slice(0, 10).forEach(row => {
                html += '<tr>';
                headers.forEach((_, i) => {
                    const value = row[i] || '-';
                    const displayValue = (i === 2) ? `$${value}` : value;
                    html += `<td>${displayValue}</td>`;
                });
                html += '</tr>';
            });
            
            html += '</tbody></table>';
            tableDiv.innerHTML = html;
        }

        // Load on page load
        loadData();
    </script>
</body>
</html>
